<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AutoMobile - Verify OTP</title>
    <link rel="icon" type="image/png" href="/static/images/logo_final.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/auth.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header text-center">
                <img src="/static/images/logo_final.png" alt="Logo" class="mb-3"
                    style="width: 80px; height: 80px; filter: drop-shadow(0 0 10px rgba(124,108,242,0.7)); object-fit: contain;">
                <h1>Verify Email</h1>
                <p id="otp-instruction">Please enter the 6-digit code sent to your email.</p>
            </div>
            <form id="verify-otp-form">
                <input type="hidden" id="otp-email" name="email">
                <div class="mb-4">
                    <label class="form-label">OTP Code</label>
                    <input type="text" class="form-control text-center fs-3" name="code" maxlength="6" required
                        placeholder="000000" style="letter-spacing: 8px;">
                </div>
                <button type="submit" class="btn btn-auth">Verify OTP</button>
                <div id="verify-message"></div>
            </form>
            <div class="resend-container">
                <p class="mb-1">Didn't receive a code?</p>
                <a href="#" id="resend-otp-link">Resend OTP</a>
            </div>
            <div class="auth-footer">
                <a href="/login/">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="/static/js/api.js"></script>
    <script>
        $(document).ready(function () {
            // Get email from URL if exists
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            if (email) {
                $('#otp-email').val(email);
                $('#otp-instruction').text('Please enter the 6-digit code sent to ' + email);
            } else {
                // Redirect back if no email is provided to verify
                window.location.href = '/signup/';
            }
        });
    </script>
</body>

</html>
