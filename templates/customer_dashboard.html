<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard</title>
    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.replace('/login/');
        }
        window.addEventListener('pageshow', function (event) {
            if (event.persisted && !localStorage.getItem('access_token')) {
                window.location.replace('/login/');
            }
        });
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <img src="/static/images/logo_motorcycle.png" alt="Logo" style="width: 56px; height: 48px; filter: drop-shadow(0 0 8px hsl(252,95%,82%)); object-fit: contain;">
            <h1 class="mb-0">AutoMobile Hub</h1>
        </div>
        <h2>Welcome, Customer!</h2>
        <p>This is your dashboard.</p>
        <button id="logout-btn" class="btn btn-danger mt-3">Logout</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/static/js/api.js"></script>
</body>

</html>
