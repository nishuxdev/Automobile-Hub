<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AutoMobile - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/auth.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header text-center">
                <img src="/static/images/logo_motorcycle.png" alt="Logo" class="mb-3"
                    style="width: 80px; height: 60px; filter: drop-shadow(0 0 8px hsl(252,95%,82%)); object-fit: contain;">
                <h1>Create Account</h1>
                <p>Join the AutoMobile marketplace</p>
            </div>
            <form id="register-form">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" name="phone" placeholder="+1234567890">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Role</label>
                        <select class="form-select" name="role">
                            <option value="customer">Customer</option>
                            <option value="mechanic">Mechanic</option>
                        </select>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-auth">Register</button>
                <div id="register-message"></div>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="/login/">Login here</a>
            </div>
        </div>
    </div>
    <script src="/static/js/api.js"></script>
</body>

</html>
