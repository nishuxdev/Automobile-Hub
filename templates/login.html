<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AutoMobile - Login</title>
    <link rel="icon" type="image/png" href="/static/images/logo_final.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/auth.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header text-center">
                <img src="/static/images/logo_final.png" alt="Logo" class="mb-3"
                    style="width: 80px; height: 80px; filter: drop-shadow(0 0 10px rgba(124,108,242,0.7)); object-fit: contain;">
                <h1>Welcome Back</h1>
                <p>Login to your AutoMobile account</p>
            </div>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-auth">Login</button>
                <div id="login-message"></div>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="/signup/">Sign up here</a>
            </div>
        </div>
    </div>
    <script src="/static/js/api.js"></script>
</body>

</html>
